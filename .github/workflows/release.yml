name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Find release label on the merged pull request
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh api "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[(.[0].labels // [])[].name | select(startswith("release:"))] | join(",")')
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          count=$(printf '%s' "$labels" | tr ',' '\n' | grep -c . || true)
          if [ "$count" -gt 1 ]; then
            echo "::error::Multiple release labels on the merged pull request: $labels"
            exit 1
          fi
      - name: Check the release token is configured
        if: steps.label.outputs.labels != ''
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Releases need a RELEASE_TOKEN secret (a repo-admin token with contents:write) so the version push can land on protected main. See docs/development.md."
            exit 1
          fi
      - name: Bump version and changelog
        if: steps.label.outputs.labels != ''
        id: bump
        env:
          LABELS: ${{ steps.label.outputs.labels }}
        run: |
          node scripts/release.mjs "${LABELS#release:}"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Commit, tag, and push
        if: steps.label.outputs.labels != ''
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "HEAD:main"
          git push origin "v${{ steps.bump.outputs.version }}"
      - name: Publish GitHub release
        if: steps.label.outputs.labels != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes
      - name: No release label — nothing to do
        if: steps.label.outputs.labels == ''
        run: echo "Merged without a release label; no release published."
