name: Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The pull request's own check already ran; this one runs against the exact tree that is
      # about to ship, and a red result stops the run before the migrations touch the database.
      - name: Check (typecheck · lint · format · tests · build)
        run: npm run check
      - name: Apply the remote D1 migrations
        working-directory: product
        run: npx wrangler d1 migrations apply jury-forge --remote
      - name: Deploy the Worker
        run: npm run deploy --workspace @jury-forge/product
